<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>DigitalLibrary API - Swagger UI</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/swagger-ui-dist/swagger-ui.css"
    >
</head>

<body>

<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>

<script>
window.onload = function () {

    SwaggerUIBundle({
        url: './swagger.yaml',

        dom_id: '#swagger-ui',

        deepLinking: true,

        presets: [
            SwaggerUIBundle.presets.apis
        ],

        layout: "BaseLayout"
    });

};
</script>

</body>
</html>
